<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museu Game Ciência VR - Escape Room Interativo</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>

    <script>
        // ==========================================
        // DADOS E COORDENADAS GLOBAIS
        // ==========================================
        window.ESCALA_MUNDO = 0.5; // compensa a arquitetura ter sido modelada para uma câmera de 3,2 m; ver atributo scale de #ambiente-museu, deve ser igual a este valor
        var BRILHO_FINO = 0.7;
        var BRILHO_GROSSO = 0.4;
        
        var ALTURA_SALA = 4.5;
        var RAIO_HEX = 8;          

        var PONTOS_TELEPORTE = [
            { id: 0, hub: {x:  0.000, z: -19.021, rot: 180}, sala: {x:   0.000, z: -60.000, rot: 0} },
            { id: 1, hub: {x:-11.180, z: -15.388, rot: 216}, sala: {x: -35.267, z: -48.541, rot: 36} },
            { id: 2, hub: {x:-18.090, z:  -5.878, rot: 252}, sala: {x: -57.063, z: -18.541, rot: 72} },
            { id: 3, hub: {x:-18.090, z:   5.878, rot: 288}, sala: {x: -57.063, z:  18.541, rot: 108} },
            { id: 4, hub: {x:-11.180, z:  15.388, rot: 324}, sala: {x: -35.267, z:  48.541, rot: 144} },
            { id: 5, hub: {x:  0.000, z:  19.021, rot: 0},   sala: {x:   0.000, z:  60.000, rot: 180} },
            { id: 6, hub: {x: 11.180, z:  15.388, rot: 36},  sala: {x:  35.267, z:  48.541, rot: 216} },
            { id: 7, hub: {x: 18.090, z:   5.878, rot: 72},  sala: {x:  57.063, z:  18.541, rot: 252} },
            { id: 8, hub: {x: 18.090, z:  -5.878, rot: 108}, sala: {x:  57.063, z: -18.541, rot: 288} },
            { id: 9, hub: {x: 11.180, z: -15.388, rot: 144}, sala: {x:  11.180, z: -15.388, rot: 324} } 
        ];

        function dimCor(hex, f) {
            var n = parseInt(hex.replace('#', ''), 16);
            var r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        // ==========================================
        // FUNÇÕES DO HUD INICIAL (Corrigido o ReferenceError)
        // ==========================================
        function liberarAcessoDireto() {
            var tentativas = 0;
            (function tentar() {
                var el = document.querySelector('[gerador-de-salas]');
                var comp = el && el.components && el.components['gerador-de-salas'];
                if (comp && typeof comp.ativarAcessoDireto === 'function') {
                    comp.ativarAcessoDireto();
                } else if (tentativas++ < 100) {
                    setTimeout(tentar, 100);
                }
            })();
        }

        // ==========================================
        // MENU INICIAL EM VR (A-Frame): funciona no desktop (mouse) e no óculos (laser).
        // O ambiente fica oculto e a locomoção travada enquanto o menu está aberto.
        // ==========================================
        window.menuInicialAberto = true;

        // true só dentro de uma sessão WebXR real (óculos/emulador). No PC, o botão de tela cheia do
        // A-Frame também liga o estado 'vr-mode', mas SEM sessão XR — por isso 'vr-mode' não serve
        // para distinguir óculos de computador.
        function emSessaoXR() {
            var sc = document.querySelector('a-scene');
            if (!sc) return false;
            if (sc.xrSession) return true;
            return !!(sc.renderer && sc.renderer.xr && sc.renderer.xr.isPresenting);
        }

        // ALTURA DA CÂMERA
        // No PC a câmera fica na altura dos olhos de uma pessoa em pé (1,6 m).
        // No óculos VR a altura NÃO é fixada pelo código: vem do próprio rastreamento da cabeça
        // (referência 'local-floor', o chão é o nível 0 definido no óculos). Assim quem joga sentado
        // tem os olhos na altura real da cabeça, sem depender da altura da pessoa.
        function aplicarAlturaCamera() {
            var cam = document.getElementById('camera-jogador');
            if (!cam) return;
            if (emSessaoXR()) {
                cam.setAttribute('position', '0 0 0');
                cam.setAttribute('camera', 'userHeight', 0);   // sem offset extra de altura
            } else {
                cam.setAttribute('position', '0 1.6 0');
                cam.setAttribute('camera', 'userHeight', 1.6);
            }
        }

        // Trava a rotação da câmera (mouse) enquanto o menu está aberto. No óculos a cabeça
        // não pode ser travada (e não deve), então dentro do VR o controle volta ao normal.
        function atualizarTravaCamera() {
            var cam = document.getElementById('camera-jogador');
            var scene = document.querySelector('a-scene');
            if (!cam || !scene) return;
            var travar = window.menuInicialAberto && !emSessaoXR();
            cam.setAttribute('look-controls', 'enabled', !travar);
            if (travar) {
                var lc = cam.components && cam.components['look-controls'];
                if (lc && lc.yawObject) lc.yawObject.rotation.y = 0;
                if (lc && lc.pitchObject) lc.pitchObject.rotation.x = 0;
            }
        }
        document.addEventListener('enter-vr', function () {
            // Tela cheia no PC: garante que nenhum bloqueio de ponteiro "prenda" o ESC
            if (!emSessaoXR() && document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
            atualizarTravaCamera();
            aplicarAlturaCamera();
        });
        document.addEventListener('exit-vr', function () {
            atualizarTravaCamera();
            aplicarAlturaCamera();
        });

        // Mantém o A-Frame sincronizado quando a tela cheia termina por fora (ESC do navegador):
        // sem isso o estado 'vr-mode' pode ficar ligado e a interface "presa" em tela cheia.
        function sincronizarSaidaTelaCheia() {
            var sc = document.querySelector('a-scene');
            var cheia = document.fullscreenElement || document.webkitFullscreenElement;
            if (!cheia && sc && sc.is('vr-mode') && !emSessaoXR()) { try { sc.exitVR(); } catch (e) {} }
        }
        document.addEventListener('fullscreenchange', sincronizarSaidaTelaCheia);
        document.addEventListener('webkitfullscreenchange', sincronizarSaidaTelaCheia);
        // ESC também solta o ponteiro e sai da tela cheia (caso o navegador entregue o evento à página)
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape' || emSessaoXR()) return;
            if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
            var cheia = document.fullscreenElement || document.webkitFullscreenElement;
            if (cheia) {
                var sair = document.exitFullscreen || document.webkitExitFullscreen;
                if (sair) { try { sair.call(document); } catch (err) {} }
            }
        });

        // Devolve a câmera e o rig ao estado inicial (usado ao voltar para a seleção de modo).
        function reiniciarCamera() {
            var rig = document.getElementById('rig');
            var cam = document.getElementById('camera-jogador');
            if (rig) {
                rig.setAttribute('scale', '1 1 1');
                rig.setAttribute('movement-controls', 'speed', 0.2);
            }
            if (cam) {
                aplicarAlturaCamera();
                cam.setAttribute('rotation', '0 0 0');
                cam.setAttribute('camera', { fov: 80, zoom: 1 });
                var lc = cam.components && cam.components['look-controls'];
                if (lc && lc.yawObject) lc.yawObject.rotation.set(0, 0, 0);
                if (lc && lc.pitchObject) lc.pitchObject.rotation.set(0, 0, 0);
            }
        }

        function abrirMenuInicial() {
            window.menuInicialAberto = true;
            reiniciarCamera();
            var menu = document.getElementById('menu-inicial-vr');
            var amb = document.getElementById('ambiente-museu');
            var rig = document.getElementById('rig');
            if (menu) menu.object3D.visible = true;
            if (amb) amb.object3D.visible = false;
            if (rig) rig.setAttribute('movement-controls', 'enabled', false);
            atualizarTravaCamera();
        }

        function iniciarAmbiente(modo) {
            if (!window.menuInicialAberto) return;
            window.menuInicialAberto = false;
            // O blink escurece a tela; a troca de cena acontece durante o escuro.
            teleportarComBlink(0, 0, 8 * window.ESCALA_MUNDO, 0, function () {
                var menu = document.getElementById('menu-inicial-vr');
                var amb = document.getElementById('ambiente-museu');
                var rig = document.getElementById('rig');
                if (menu) menu.object3D.visible = false;
                if (amb) amb.object3D.visible = true;
                if (rig) rig.setAttribute('movement-controls', 'enabled', true);
                atualizarTravaCamera();
                if (modo === 'visitar') liberarAcessoDireto();
            });
        }

        // Botão do menu (aparência do HUD antigo): fundo escuro, borda e texto na cor do modo;
        // no hover o fundo se preenche com a cor e o texto escurece.
        // Uso: <a-plane class="interactable" botao-modo="modo: visitar; cor: #00fff2"> + texto filho.
        AFRAME.registerComponent('botao-modo', {
            schema: { modo: { type: 'string' }, cor: { default: '#00fff2' } },
            init: function () {
                var el = this.el, d = this.data;
                var texto = function () { return el.querySelector('[troika-text]'); };
                el.addEventListener('click', function () { iniciarAmbiente(d.modo); });
                el.addEventListener('mouseenter', function () {
                    el.setAttribute('material', 'color', d.cor);
                    var t = texto(); if (t) t.setAttribute('troika-text', 'color', '#05010f');
                });
                el.addEventListener('mouseleave', function () {
                    el.setAttribute('material', 'color', '#0c0c18');
                    var t = texto(); if (t) t.setAttribute('troika-text', 'color', d.cor);
                });
            }
        });

        // Logo sem distorção: lê a proporção real da imagem e encaixa (com fundo branco) numa
        // caixa máxima. Filhos esperados: .logo-fundo (plano branco) e .logo-imagem (a-image).
        AFRAME.registerComponent('logo-proporcional', {
            schema: { larguraMax: { default: 1.8 }, alturaMax: { default: 0.85 }, margem: { default: 0.08 }, asset: { default: '#logo-mgc' } },
            init: function () {
                var self = this, d = this.data;
                var fundo = this.el.querySelector('.logo-fundo'), img = this.el.querySelector('.logo-imagem');
                var asset = document.querySelector(d.asset);
                var ajustar = function () {
                    if (!asset || !asset.naturalWidth || !fundo || !img) return;
                    var r = asset.naturalHeight / asset.naturalWidth;
                    var w = Math.min(d.larguraMax, d.alturaMax / r), h = w * r;
                    img.setAttribute('width', w.toFixed(4)); img.setAttribute('height', h.toFixed(4));
                    fundo.setAttribute('width', (w + 2 * d.margem).toFixed(4)); fundo.setAttribute('height', (h + 2 * d.margem).toFixed(4));
                };
                if (asset && asset.complete && asset.naturalWidth) ajustar();
                else if (asset) asset.addEventListener('load', ajustar);
            }
        });

        // ==========================================
        // COMPONENTE: RASTREADOR DE COORDENADAS (DEBUG)
        // ==========================================
        AFRAME.registerComponent('rastreador-coords', {
            tick: function () {
                var display = document.getElementById('coord-display');
                var cam = document.querySelector('#camera-jogador');
                if (display && cam && cam.object3D) {
                    var pos = new THREE.Vector3();
                    cam.object3D.getWorldPosition(pos);
                    display.innerText = 'X: ' + pos.x.toFixed(3) + ' | Y: ' + pos.y.toFixed(3) + ' | Z: ' + pos.z.toFixed(3);
                }
            }
        });

        // ==========================================
        // COMPONENTE: CURSOR QUE SEGUE O MOUSE
        // ==========================================
        AFRAME.registerComponent('mouse-cursor-tracker', {
            init: function () {
                this.mouse = new THREE.Vector2();
                this.cameraEl = document.querySelector('#camera-jogador');
                
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                });
            },
            tick: function () {
                // Dentro do óculos o anel do mouse não existe (o laser dos controles faz o apontamento)
                if (emSessaoXR()) {
                    this.el.object3D.visible = false;
                    return;
                }
                this.el.object3D.visible = true;
                
                var cam = this.cameraEl.getObject3D('camera');
                if(cam) {
                    var fov = cam.fov * Math.PI / 180;
                    var aspect = cam.aspect;
                    var z = -1.5; 
                    var h = 2 * Math.tan(fov / 2) * Math.abs(z);
                    var w = h * aspect;
                    
                    this.el.object3D.position.x += ((this.mouse.x * w/2) - this.el.object3D.position.x) * 0.4;
                    this.el.object3D.position.y += ((this.mouse.y * h/2) - this.el.object3D.position.y) * 0.4;
                    this.el.object3D.position.z = z;
                }
            }
        });

        // ==========================================
        // COMPONENTE: BLINK (FADE PRETO PARA TELEPORTE)
        // ==========================================
        AFRAME.registerComponent('blink-fade', {
            schema: { duracao: { default: 180 } }, 
            init: function () {
                this.estado = 'ocioso';
                this.t = 0;
                this.acao = null;
                this.el.object3D.visible = false;
            },
            disparar: function (acao) {
                if (this.estado !== 'ocioso') return; 
                this.acao = acao;
                this.estado = 'escurecendo';
                this.t = 0;
                this.el.object3D.visible = true;
            },
            tick: function (time, dt) {
                if (this.estado === 'ocioso') return;
                var mesh = this.el.getObject3D('mesh');
                if (!mesh) { 
                    if (this.acao) this.acao();
                    this.acao = null;
                    this.estado = 'ocioso';
                    return;
                }
                mesh.renderOrder = 999;
                this.t += dt;
                var k = Math.min(this.t / this.data.duracao, 1);
                if (this.estado === 'escurecendo') {
                    mesh.material.opacity = k;
                    if (k >= 1) {
                        if (this.acao) this.acao();
                        this.acao = null;
                        this.estado = 'clareando';
                        this.t = 0;
                    }
                } else {
                    mesh.material.opacity = 1 - k;
                    if (k >= 1) {
                        this.estado = 'ocioso';
                        this.el.object3D.visible = false;
                    }
                }
            }
        });

        // alinharOlhar (opcional): no óculos, gira o rig para compensar a direção real da cabeça,
        // de modo que o jogador chegue olhando exatamente para rotYGraus (ex.: de frente para o menu).
        // No desktop o mesmo efeito vem de zerar o giro do mouse (look-controls).
        function teleportarComBlink(x, y, z, rotYGraus, aoTeleportar, alinharOlhar) {
            var rig = document.querySelector('#rig');
            var blink = document.querySelector('#blink');
            var fade = blink && blink.components['blink-fade'];
            if (!rig) return;
            
            var aplicar = function () {
                var cam = document.querySelector('#camera-jogador');
                var offsetX = 0;
                var offsetZ = 0;

                // giro final do rig (graus); com alinharOlhar no VR, desconta o heading da cabeça
                var rotFinal = rotYGraus || 0;
                var sceneEl = document.querySelector('a-scene');
                if (alinharOlhar && cam && cam.object3D && emSessaoXR()) {
                    var eulCabeca = new THREE.Euler().setFromQuaternion(cam.object3D.quaternion, 'YXZ');
                    rotFinal = (rotYGraus || 0) - eulCabeca.y * 180 / Math.PI;
                }
                
                if (cam && cam.object3D) {
                    var offset = cam.object3D.position.clone();
                    offset.y = 0; 
                    
                    var anguloRad = rotFinal * Math.PI / 180;
                    var eul = new THREE.Euler(0, anguloRad, 0, 'YXZ');
                    offset.applyEuler(eul);
                    
                    offsetX = offset.x;
                    offsetZ = offset.z;
                }
                
                rig.setAttribute('position', { x: x - offsetX, y: y, z: z - offsetZ });
                rig.setAttribute('rotation', { x: 0, y: rotFinal, z: 0 });
                
                if (aoTeleportar) aoTeleportar();
                try {
                    var lc = cam && cam.components['look-controls'];
                    if (lc && lc.yawObject && !emSessaoXR()) lc.yawObject.rotation.y = 0;
                } catch (e) {}
            };
            
            if (!fade) { aplicar(); return; }
            fade.disparar(aplicar);
        }

        // ==========================================
        // GERAÇÃO DE SALAS HEXAGONAIS
        // ==========================================
        function criarEl(tag, attrs, pai) {
            var e = document.createElement(tag);
            for (var k in attrs) e.setAttribute(k, String(attrs[k]));
            if (pai) pai.appendChild(e);
            return e;
        }

        var salasGeracaoRefs = new Array(9);
        function mostrarSala(i) {
            for (var k = 0; k < 9; k++) if (salasGeracaoRefs[k]) salasGeracaoRefs[k].setAttribute('visible', k === i);
        }
        function esconderSalas() {
            for (var k = 0; k < 9; k++) if (salasGeracaoRefs[k]) salasGeracaoRefs[k].setAttribute('visible', false);
        }

        AFRAME.registerComponent('salas-geracao', {
            init: function () {
                for (var i = 0; i < 9; i++) this.construirSala(i);
            },
            construirSala: function (i) {
                var c = conteudosMuseu[i];
                var fina = dimCor(c.cor, BRILHO_FINO);
                var wp = PONTOS_TELEPORTE[i].sala;
                
                var sala = criarEl('a-entity', { position: wp.x.toFixed(3) + ' 0 ' + wp.z.toFixed(3), rotation: '0 ' + wp.rot + ' 0', visible: 'false' }, this.el);
                salasGeracaoRefs[i] = sala;

                criarEl('a-cylinder', { position: '0 ' + (ALTURA_SALA / 2) + ' 0', rotation: '0 30 0', radius: RAIO_HEX, height: ALTURA_SALA, 'segments-radial': 6, material: 'shader: flat; color: #05010f; side: back' }, sala);
                criarEl('a-circle', { position: '0 0.02 0', rotation: '-90 0 0', radius: RAIO_HEX, segments: 6, 'piso-neon': 'cor: ' + fina + '; repeat: 6 6' }, sala);
                criarEl('a-torus', { position: '0 0.06 0', rotation: '90 0 0', radius: RAIO_HEX, 'radius-tubular': 0.06, 'segments-tubular': 6, material: 'shader: flat; color: ' + fina }, sala);
                criarEl('a-torus', { position: '0 ' + (ALTURA_SALA - 0.06) + ' 0', rotation: '90 0 0', radius: RAIO_HEX, 'radius-tubular': 0.06, 'segments-tubular': 6, material: 'shader: flat; color: ' + fina }, sala);

                criarEl('a-entity', { position: '0 3.1 -6.85', 'troika-text': 'value: ' + c.sala.toUpperCase() + '\n( ' + c.ano + ' ); color: ' + fina + '; align: center; fontSize: 0.42; maxWidth: 6; lineHeight: 1.2' }, sala);
                criarEl('a-entity', { position: '0 1.9 -6.85', 'troika-text': 'value: SALA TEMPORÁRIA — EM CONSTRUÇÃO\nAqui ficarão os jogos da ' + c.sala + '.; color: #ffffff; align: center; fontSize: 0.2; maxWidth: 6; lineHeight: 1.3' }, sala);

                var ped = criarEl('a-entity', { position: '0 0 -3' }, sala);
                criarEl('a-cylinder', { position: '0 0.5 0', radius: 0.35, height: 1, color: '#12121f' }, ped);
                criarEl('a-torus', { position: '0 1.0 0', rotation: '90 0 0', radius: 0.35, 'radius-tubular': 0.02, material: 'shader: flat; color: ' + fina }, ped);
                var btn = criarEl('a-cylinder', { position: '0 1.05 0', radius: 0.2, height: 0.08, material: 'shader: flat; color: ' + fina, class: 'interactable', animation__pulse: 'property: material.color; from: #111111; to: ' + fina + '; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine' }, ped);
                criarEl('a-entity', { position: '0 1.6 0', 'troika-text': 'value: VOLTAR AO HUB; color: #ffffff; align: center; fontSize: 0.16; maxWidth: 1.8; outlineWidth: 0.006; outlineColor: #000000' }, ped);
                
                btn.addEventListener('click', function () {
                    var r = PONTOS_TELEPORTE[i].hub;
                    teleportarComBlink(r.x * window.ESCALA_MUNDO, 0, r.z * window.ESCALA_MUNDO, r.rot, function () { esconderSalas(); });
                });
            }
        });

        // ==========================================
        // COMPONENTE: VOO VERTICAL (EXCLUSIVO DESENVOLVEDOR)
        // ==========================================
        AFRAME.registerComponent('vertical-movement', {
            schema: { speed: { default: 0.15 } },
            init: function () {
                this.keys = {};
                this.active = false;
                window.addEventListener('keydown', (e) => { this.keys[e.key.toLowerCase()] = true; });
                window.addEventListener('keyup', (e) => { this.keys[e.key.toLowerCase()] = false; });
            },
            tick: function () {
                if (!this.active) return;
                if (this.keys['e']) {
                    this.el.object3D.position.y += this.data.speed;
                }
                if (this.keys['q']) {
                    this.el.object3D.position.y -= this.data.speed;
                }
            }
        });

        // ==========================================
        // DADOS CURATORIAIS
        // ==========================================
        // Modelo 3D do console (CC-BY 4.0 — Atari 2600 low poly console, por mismailsbasura,
        // https://sketchfab.com/3d-models/atari-2600-low-poly-console-b1dff98350be4137be24695b04a199c8).
        // Embutido como data URI para o arquivo continuar sendo um único .html autocontido.
        
        var conteudosMuseu = [
            {
                "sala": "1ª Geração",
                "ano": "1972–1977",
                "cor": "#ff7b00",
                "tipo": "arcade",
                "tema": "A Origem dos Consoles Domésticos e a Era dos Jogos Dedicados",
                "video": {
                    "titulo": "A história da 1ª geração de video-games – História da Tecnologia",
                    "fonte": "TecMundo",
                    "funcao": "Executa o clipe historiográfico demonstrando o funcionamento do Brown Box, do Odyssey e do Pong, emitindo os efeitos sonoros característicos da época (\"bipes\" de colisão de pixels)."
                },
                "esq": {
                    "titulo": "Magnavox Odyssey 400",
                    "anos": "1976",
                    "fabricante": "Magnavox / Philips",
                    "geracao": "1ª Geração",
                    "ficha": "Circuitos lógicos analógicos (sem CPU); 3 jogos embutidos (Smash, Tennis, Hockey); pontuação automática na tela; controles por botões giratórios.",
                    "texto": "Lançado nos Estados Unidos em 1976 após a aquisição da Magnavox pela Philips, o Odyssey 400 foi um marco da primeira geração de consoles. Seu grande diferencial tecnológico foi a introdução da pontuação automática exibida diretamente na tela do televisor, recurso inédito em relação aos modelos anteriores. Operado por três seletores giratórios de cada lado do aparelho, estimulava a interação familiar e o raciocínio espacial em partidas baseadas no clássico Pong.",
                    "curva": {

        function texturaGridNeon(corLinha) {
            var c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#05010f';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = corLinha;
            ctx.lineWidth = 4;
            ctx.shadowColor = corLinha;                
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(256, 0);
            ctx.moveTo(0, 0); ctx.lineTo(0, 256);
            ctx.stroke();
            return c.toDataURL();
        }

            schema: { cor: { default: '#00fff2' }, repeat: { default: '8 8' } },
            init: function () { this.aplicarTextura(); },

                if (oldData.cor !== this.data.cor || oldData.repeat !== this.data.repeat) this.aplicarTextura();
            },
            aplicarTextura: function() {
                this.el.setAttribute('material', { shader: 'flat', src: texturaGridNeon(this.data.cor), repeat: this.data.repeat });
            }
        });

            init: function () {

            criarBotao: function (pai, rotulo, w, h, fonte, pos, aoClicar) {

                    var pv = dt / 220;
                    this.vis = this.vis < this.visAlvo ? Math.min(this.vis + pv, 1) : Math.max(this.vis - pv, 0);

        AFRAME.registerComponent('gerador-de-salas', {
            init: function () {
                var self = this;

                    "ENIGMA 1:\nQUAL O CÓDIGO DA GERAÇÃO DO\nPRIMEIRO VIDEOGAME DO MUNDO?",
                    "ENIGMA 2:\nQUAL O CÓDIGO DA GERAÇÃO QUE POPULARIZOU\nOS JOGOS EDUCATIVOS NO BRASIL?",
                    "ENIGMA 3:\nQUAL O CÓDIGO DA GERAÇÃO COM\nJOGOS REFERÊNCIA COMO MARIO BROS?",
                    "ENIGMA 4:\nQUAL O CÓDIGO DA GERAÇÃO COM\nO RÁPIDO PROCESSADOR DO MEGA DRIVE?"
                ];
                
                this.aneisCupula = [];
                this.totensCores = []; 

                var raioRotunda = 20.0;     
                var alturaImposta = 6.0; 
                
                var anguloRad = 18 * (Math.PI / 180);
                var pX = raioRotunda * Math.sin(anguloRad); 
                var pZ = -(raioRotunda * Math.cos(anguloRad)); 
                
                var alturaTopoArcos = alturaImposta + pX + 0.1; 
                var raioTuboAro = 0.15;
                var alturaAro = alturaTopoArcos + raioTuboAro; 
                
                // ---- CÚPULA PRINCIPAL COMO CALOTA ESFÉRICA ----
                // O anel da base (raio = raioRotunda, altura = alturaAro) é fixo. A cúpula deixa de ser
                // um hemisfério (altura = raio) e passa a ter altura = raioRotunda * fatorAlturaCupula.
                // Uma calota de base 'a' e altura 'h' pertence a uma esfera de raio R = (a² + h²) / (2h),
                // com centro em y = alturaAro + h - R e abertura (theta-length) = asin(a / R).
                // fatorAlturaCupula = 1 reproduz o hemisfério original; 0.5 = metade da altura.
                var fatorAlturaCupula = 0.75;
                var alturaCupula = raioRotunda * fatorAlturaCupula;
                var raioEsfera = (Math.pow(raioRotunda, 2) + Math.pow(alturaCupula, 2)) / (2 * alturaCupula);
                var centroYEsfera = alturaAro + alturaCupula - raioEsfera;
                var anguloBaseGraus = Math.asin(raioRotunda / raioEsfera) * 180 / Math.PI;

                // Anel central (óculo): continua no mesmo raio horizontal, agora sobre a nova superfície
                var raioOculus = raioRotunda * 0.25; 
                var alturaOculus = centroYEsfera + Math.sqrt(Math.pow(raioEsfera, 2) - Math.pow(raioOculus, 2));
                var distYOculus = alturaOculus - alturaAro;

                var chaoCentral = document.createElement('a-circle');
                chaoCentral.setAttribute('position', '0 0 0');
                chaoCentral.setAttribute('rotation', '-90 18 0'); 
                chaoCentral.setAttribute('radius', raioRotunda.toFixed(3));
                chaoCentral.setAttribute('segments', '10');
                chaoCentral.setAttribute('piso-neon', 'cor: ' + dimCor('#00fff2', BRILHO_FINO) + '; repeat: ' + (raioRotunda * 0.9).toFixed(0) + ' ' + (raioRotunda * 0.9).toFixed(0));
                centro.appendChild(chaoCentral);

                var cupulaPrincipal = document.createElement('a-sphere');
                cupulaPrincipal.setAttribute('position', '0 ' + centroYEsfera.toFixed(3) + ' 0');
                cupulaPrincipal.setAttribute('radius', raioEsfera.toFixed(3));
                cupulaPrincipal.setAttribute('color', '#05010f');
                cupulaPrincipal.setAttribute('material', 'side: back; roughness: 1');
                cupulaPrincipal.setAttribute('theta-length', anguloBaseGraus.toFixed(3));
                cupulaPrincipal.setAttribute('segments-width', '10');
                centro.appendChild(cupulaPrincipal);

                var aroHorizontal = document.createElement('a-torus');
                aroHorizontal.setAttribute('position', '0 ' + alturaAro.toFixed(3) + ' 0');
                // +0.05 para não coincidir exatamente com a superfície da cúpula (evita
                // z-fighting na borda inferior, mais visível depois da redução de escala)
                aroHorizontal.setAttribute('radius', (raioRotunda + 0.05).toFixed(3));
                aroHorizontal.setAttribute('radius-tubular', raioTuboAro.toString());
                aroHorizontal.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                aroHorizontal.setAttribute('rotation', '90 0 0'); 
                aroHorizontal.setAttribute('segments-tubular', '10');
                centro.appendChild(aroHorizontal);

                var distY1 = distYOculus / 3; 
                var raioAroInt1 = Math.sqrt(Math.pow(raioEsfera, 2) - Math.pow(alturaAro + distY1 - centroYEsfera, 2)); 
                var alturaAroInt1 = alturaAro + distY1;
                var aroInt1 = document.createElement('a-torus');
                aroInt1.setAttribute('position', '0 ' + alturaAroInt1.toFixed(3) + ' 0');
                aroInt1.setAttribute('radius', raioAroInt1.toFixed(3));
                aroInt1.setAttribute('radius-tubular', '0.12');
                aroInt1.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                aroInt1.setAttribute('rotation', '90 0 0');
                aroInt1.setAttribute('segments-tubular', '10');
                centro.appendChild(aroInt1);

                var distY2 = (distYOculus / 3) * 2; 
                var raioAroInt2 = Math.sqrt(Math.pow(raioEsfera, 2) - Math.pow(alturaAro + distY2 - centroYEsfera, 2));
                var alturaAroInt2 = alturaAro + distY2;
                var aroInt2 = document.createElement('a-torus');
                aroInt2.setAttribute('position', '0 ' + alturaAroInt2.toFixed(3) + ' 0');
                aroInt2.setAttribute('radius', raioAroInt2.toFixed(3));
                aroInt2.setAttribute('radius-tubular', '0.12');
                aroInt2.setAttribute('material', 'shader: flat; color: ' + this.corApagada);
                aroInt2.setAttribute('rotation', '90 0 0');
                aroInt2.setAttribute('segments-tubular', '10');
                centro.appendChild(aroInt2);

                var anelCentral = document.createElement('a-torus');
                anelCentral.setAttribute('position', '0 ' + alturaOculus.toFixed(3) + ' 0');
                anelCentral.setAttribute('radius', raioOculus.toFixed(3));
                anelCentral.setAttribute('radius-tubular', '0.2');

                        var detalheMesa = document.createElement('a-plane'); detalheMesa.setAttribute('position', '0 0 0.01'); detalheMesa.setAttribute('width', '2.7'); detalheMesa.setAttribute('height', '0.9'); detalheMesa.setAttribute('material', 'shader: flat; color: ' + corNeon); painelBaixo.appendChild(detalheMesa);
                        var fundoMesa = document.createElement('a-plane'); fundoMesa.setAttribute('position', '0 0 0.02'); fundoMesa.setAttribute('width', '2.6'); fundoMesa.setAttribute('height', '0.8'); fundoMesa.setAttribute('color', '#05010f'); painelBaixo.appendChild(fundoMesa);

                        var btnPrev = document.createElement('a-circle'); btnPrev.setAttribute('position', '-0.6 0 0.03'); btnPrev.setAttribute('radius', '0.15'); btnPrev.setAttribute('color', '#0a0a15');
                        var ringPrev = document.createElement('a-ring'); ringPrev.setAttribute('radius-inner', '0.13'); ringPrev.setAttribute('radius-outer', '0.15'); ringPrev.setAttribute('position', '0 0 0.01'); ringPrev.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPrev.appendChild(ringPrev);
                        var iconPrev = document.createElement('a-triangle'); iconPrev.setAttribute('vertex-a', '0 0.07 0'); iconPrev.setAttribute('vertex-b', '-0.07 -0.07 0'); iconPrev.setAttribute('vertex-c', '0.07 -0.07 0'); iconPrev.setAttribute('rotation', '0 0 90'); iconPrev.setAttribute('position', '-0.02 0 0.02'); iconPrev.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPrev.appendChild(iconPrev);
                        var barPrev = document.createElement('a-plane'); barPrev.setAttribute('width', '0.04'); barPrev.setAttribute('height', '0.14'); barPrev.setAttribute('position', '-0.08 0 0.02'); barPrev.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPrev.appendChild(barPrev); painelBaixo.appendChild(btnPrev);

                        var btnPlay = document.createElement('a-circle'); btnPlay.setAttribute('position', '0 0 0.03'); btnPlay.setAttribute('radius', '0.15'); btnPlay.setAttribute('color', '#0a0a15');
                        var ringPlay = document.createElement('a-ring'); ringPlay.setAttribute('radius-inner', '0.13'); ringPlay.setAttribute('radius-outer', '0.15'); ringPlay.setAttribute('position', '0 0 0.01'); ringPlay.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPlay.appendChild(ringPlay);
                        var iconPlay = document.createElement('a-triangle'); iconPlay.setAttribute('vertex-a', '0 0.07 0'); iconPlay.setAttribute('vertex-b', '-0.07 -0.07 0'); iconPlay.setAttribute('vertex-c', '0.07 -0.07 0'); iconPlay.setAttribute('rotation', '0 0 -90'); iconPlay.setAttribute('position', '0.02 0 0.02'); iconPlay.setAttribute('material', 'shader: flat; color: ' + corNeon); btnPlay.appendChild(iconPlay); painelBaixo.appendChild(btnPlay);

                        var btnNext = document.createElement('a-circle'); btnNext.setAttribute('position', '0.6 0 0.03'); btnNext.setAttribute('radius', '0.15'); btnNext.setAttribute('color', '#0a0a15');
                        var ringNext = document.createElement('a-ring'); ringNext.setAttribute('radius-inner', '0.13'); ringNext.setAttribute('radius-outer', '0.15'); ringNext.setAttribute('position', '0 0 0.01'); ringNext.setAttribute('material', 'shader: flat; color: ' + corNeon); btnNext.appendChild(ringNext);
                        var iconNext = document.createElement('a-triangle'); iconNext.setAttribute('vertex-a', '0 0.07 0'); iconNext.setAttribute('vertex-b', '-0.07 -0.07 0'); iconNext.setAttribute('vertex-c', '0.07 -0.07 0'); iconNext.setAttribute('rotation', '0 0 -90'); iconNext.setAttribute('position', '0.02 0 0.02'); iconNext.setAttribute('material', 'shader: flat; color: ' + corNeon); btnNext.appendChild(iconNext);
                        var barNext = document.createElement('a-plane'); barNext.setAttribute('width', '0.04'); barNext.setAttribute('height', '0.14'); barNext.setAttribute('position', '0.08 0 0.02'); barNext.setAttribute('material', 'shader: flat; color: ' + corNeon); btnNext.appendChild(barNext); painelBaixo.appendChild(btnNext);
                        
                        totemArcade.appendChild(painelBaixo);
                        grupoCont.appendChild(totemArcade);
                    } else {
                        this.construirTerminalCentral(grupoCont);
                    }

                    ala.appendChild(grupoCont);

                    // Exêdra do terminal (i = 9): piso, borda da plataforma e listra da parede
                    // ficam sempre acesos, mesmo com o puzzle apagado.
                    if (i === 9) {
                        exedraChao.setAttribute('piso-neon', 'cor', corNeon);
                        bordaPlataforma.setAttribute('material', 'color', corNeon);
                        listraNeon.setAttribute('material', 'color', corNeon);
                    }

                    this.totensCores.push({ 
                        anelBase: anelBaseTotem, faixa: faixaTotem, btn: botaoFisico, aroBotao: aroBotao,
                        pisoCirc: exedraChao, bordaPlat: bordaPlataforma, listra: listraNeon,
                        linhaPivot: linhaPivot,
                        arqEntity: grupoArq, conteudoEntity: grupoCont, rotulo: rotuloTp, 
                        corOriginal: corNeon, timerID: null 
                    });

                    centro.appendChild(ala);
                }

                this.atualizarPulsos();

                // Pergunta 1 no jumbotron desde o início (ligada às senhas, não ao totem 9)
                var sceneEl = this.el.sceneEl;
                if (sceneEl.hasLoaded) this.atualizarJumbotron();
                else sceneEl.addEventListener('loaded', function () { self.atualizarJumbotron(); });
            },

            construirTerminalCentral: function(containerLocal) {
                var self = this;
                
                var estante = document.createElement('a-entity');
                // +1.8: mesma distância do centro da exêdra de antes (era -1.8, lado da parede),
                // agora entre o centro da exêdra e o centro do salão.
                estante.setAttribute('position', '0 0.1 1.8'); 
                estante.setAttribute('rotation', '0 180 0'); 
                
                var pilar = document.createElement('a-cylinder');
                pilar.setAttribute('position', '0 0.7 0'); 
                pilar.setAttribute('radius', '0.3'); 
                pilar.setAttribute('height', '1.4'); 
                pilar.setAttribute('color', '#0c0c18');
                estante.appendChild(pilar);
                
                var anel = document.createElement('a-torus');
                anel.setAttribute('position', '0 1.3 0'); 
                anel.setAttribute('rotation', '90 0 0'); 
                anel.setAttribute('radius', '0.3'); 
                anel.setAttribute('radius-tubular', '0.02'); 
                anel.setAttribute('material', 'shader: flat; color: #00fff2');
                estante.appendChild(anel);

                var painelTerm = document.createElement('a-entity');
                painelTerm.setAttribute('position', '0 2.05 0.1'); 
                painelTerm.setAttribute('rotation', '-20 0 0'); 
                
                var fundo = document.createElement('a-cylinder');
                fundo.setAttribute('radius', '0.65');
                fundo.setAttribute('height', '0.1');
                fundo.setAttribute('rotation', '90 0 0');
                fundo.setAttribute('position', '0 0 -0.05');
                fundo.setAttribute('color', '#12121f');
                painelTerm.appendChild(fundo);

                var molduraNeon = document.createElement('a-torus');
                molduraNeon.setAttribute('radius', '0.65');
                molduraNeon.setAttribute('radius-tubular', '0.0075');
                molduraNeon.setAttribute('rotation', '0 0 0');
                molduraNeon.setAttribute('position', '0 0 -0.049');
                molduraNeon.setAttribute('material', 'shader: flat; color: #00fff2');
                painelTerm.appendChild(molduraNeon);

                var display = document.createElement('a-plane');
                display.setAttribute('position', '0 0.35 0.01'); 
                display.setAttribute('width', '0.6'); 
                display.setAttribute('height', '0.18'); 
                display.setAttribute('color', '#000000');
                
                this.textoDisplay = document.createElement('a-entity');
                this.textoDisplay.setAttribute('troika-text', 'value: SENHA ' + (this.terminalStep + 1) + ':\n_ _ _; color: #00fff2; align: center; fontSize: 0.055');
                this.textoDisplay.setAttribute('position', '0 0 0.01');
                display.appendChild(this.textoDisplay);
                painelTerm.appendChild(display);

                var botoesInfo = [
                    { t: '1', x: -0.15, y: 0.10 }, { t: '2', x: 0, y: 0.10 }, { t: '3', x: 0.15, y: 0.10 },
                    { t: '4', x: -0.15, y: -0.05 }, { t: '5', x: 0, y: -0.05 }, { t: '6', x: 0.15, y: -0.05 },
                    { t: '7', x: -0.15, y: -0.20 }, { t: '8', x: 0, y: -0.20 }, { t: '9', x: 0.15, y: -0.20 },
                    { t: 'C', x: -0.15, y: -0.35, c: '#ff2d55' }, { t: '0', x: 0, y: -0.35 }, { t: 'V', x: 0.15, y: -0.35, c: '#39ff14' }
                ];

                botoesInfo.forEach(function(b) {
                    var btnBox = document.createElement('a-box');
                    btnBox.setAttribute('position', b.x + ' ' + b.y + ' 0.01'); 
                    btnBox.setAttribute('width', '0.1'); 
                    btnBox.setAttribute('height', '0.1'); 
                    btnBox.setAttribute('depth', '0.02'); 
                    btnBox.setAttribute('color', '#12121f');
                    btnBox.classList.add('interactable'); 

                    var textBtn = document.createElement('a-entity');
                    var corT = b.c ? b.c : '#ffffff';
                    textBtn.setAttribute('troika-text', 'value: ' + b.t + '; color: ' + corT + '; align: center; fontSize: 0.06');
                    textBtn.setAttribute('position', '0 0 0.015'); 
                    btnBox.appendChild(textBtn);

                    btnBox.addEventListener('click', function() { self.cliqueTerminal(b.t); });
                    painelTerm.appendChild(btnBox);
                });

                estante.appendChild(painelTerm);
                containerLocal.appendChild(estante);
            },

            atualizarPulsos: function() {
                var ativas = this.lightsOutState.filter(function(s) { return s; }).length;
                var autoStart = (ativas === 0);
                
                this.totensCores.forEach(function(props) {
                    if (autoStart) {
                        props.aroBotao.setAttribute('animation__pulse', 'enabled', 'true');
                    } else {
                        props.aroBotao.setAttribute('animation__pulse', 'enabled', 'false');
                        props.aroBotao.setAttribute('material', 'color', '#333');
                    }
                });
            },

            processarLightsOut: function(indexApertado) {
                if (window.menuInicialAberto) return; // menu aberto: ambiente oculto, ignora cliques
                if (this.terminalStep >= 4) {
                    var wp = PONTOS_TELEPORTE[indexApertado].sala;
                    var iAla = indexApertado;
                    teleportarComBlink(wp.x * window.ESCALA_MUNDO, 0, wp.z * window.ESCALA_MUNDO, wp.rot, function () {
                        if (iAla < 9) mostrarSala(iAla); else esconderSalas();
                    });
                    return;
                }

                var esq = (indexApertado - 1 + 10) % 10;
                var dir = (indexApertado + 1) % 10;
                
                this.inverterEstado(esq);
                this.inverterEstado(indexApertado);
                this.inverterEstado(dir);

                this.atualizarPulsos();
            },

            inverterEstado: function(idx) {
                this.lightsOutState[idx] = !this.lightsOutState[idx];
                this.aplicarEstadoVisual(idx, this.lightsOutState[idx]);
            },

            aplicarEstadoVisual: function(idx, ligado) {
                var props = this.totensCores[idx];
                var self = this;
                var acessoTotal = this.terminalStep >= 4;
                if (props.rotulo) props.rotulo.setAttribute('visible', acessoTotal);

                // (O jumbotron não depende mais do totem 9: ver atualizarJumbotron(), ligado às senhas.)

                if (props.timerID) clearTimeout(props.timerID);

                if(ligado) {
                    props.anelBase.setAttribute('material', 'color', props.corOriginal);
                    props.faixa.setAttribute('material', 'color', props.corOriginal);
                    props.btn.setAttribute('material', 'color', props.corOriginal);
                    
                    props.linhaPivot.setAttribute('animation', 'property: scale; to: 1 1 1; dur: 600; easing: easeOutQuad');
                    
                    props.timerID = setTimeout(function() {
                        props.pisoCirc.setAttribute('piso-neon', 'cor', props.corOriginal); 
                        props.bordaPlat.setAttribute('material', 'color', props.corOriginal);
                        props.listra.setAttribute('material', 'color', props.corOriginal);

                        if(acessoTotal) {
                            props.arqEntity.setAttribute('animation', 'property: scale; to: 1 1 1; dur: 500; easing: easeOutQuad');
                        }
                        if(props.conteudoEntity && idx !== 9) {
                            props.conteudoEntity.setAttribute('animation', 'property: scale; to: 1 1 1; dur: 400; easing: easeOutQuad');
                        }
                    }, 600);
                    
                } else {
                    // idx 9 (exêdra do terminal) mantém piso, borda e listra acesos
                    var corFixa = (idx === 9) ? props.corOriginal : this.corApagada;
                    props.pisoCirc.setAttribute('piso-neon', 'cor', corFixa); 
                    props.bordaPlat.setAttribute('material', 'color', corFixa);
                    props.listra.setAttribute('material', 'color', corFixa);

                    props.arqEntity.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 800; easing: easeInQuad');
                    if(props.conteudoEntity && idx !== 9) {
                        props.conteudoEntity.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 400; easing: easeInQuad');
                    }

                    props.linhaPivot.setAttribute('animation', 'property: scale; to: 1 1 0.001; dur: 600; easing: easeInQuad');
                    
                    props.timerID = setTimeout(function() {
                        props.anelBase.setAttribute('material', 'color', self.corApagada);
                        props.faixa.setAttribute('material', 'color', self.corApagada);
                        props.btn.setAttribute('material', 'color', self.corApagada);
                    }, 600);
                }
            },

            cliqueTerminal: function(tecla) {
                if (window.menuInicialAberto) return;
                if(this.terminalStep >= 4) {
                    if(tecla === 'C') this.resetJogo();
                    if(tecla === 'V' && this.inputAtual === "123") this.ativarModoDev();
                    if(tecla !== 'C' && tecla !== 'V' && this.inputAtual.length < 5) {
                        this.inputAtual += tecla;
                        this.atualizarDisplay();
                    }
                    return; 
                }

                if(tecla === 'C') {
                    this.inputAtual = "";
                } else if(tecla === 'V') {
                    if (this.inputAtual === "123") {
                        this.ativarModoDev();
                        return;
                    }

                    if(this.inputAtual === this.senhas[this.terminalStep]) {
                        this.aneisCupula[this.terminalStep].setAttribute('material', 'color', this.corCoroa);
                        this.terminalStep++;
                        this.inputAtual = "";
                        
                        this.atualizarJumbotron(); // próxima pergunta (ou padrão, se acesso total)

                        if(this.terminalStep === 4) {
                            this.textoDisplay.setAttribute('troika-text', 'value: ACESSO TOTAL!\nSISTEMA ONLINE\n[ C ] P/ REINICIAR; color: #39ff14; align: center; fontSize: 0.045');
                            this.textoDisplay.setAttribute('position', '0 0 0.01');
                            
                            for(var a = 0; a < 10; a++) {
                                this.lightsOutState[a] = true;
                                this.aplicarEstadoVisual(a, true);
                            }
                            this.atualizarPulsos();
                        } else {
                            this.textoDisplay.setAttribute('troika-text', 'value: SENHA ACEITA!\nREINICIANDO...; color: #39ff14; align: center; fontSize: 0.055');
                            this.textoDisplay.setAttribute('position', '0 0 0.01');
                            // Recolhe os elementos NA HORA em que a senha é aceita (antes esperava 2,5 s,
                            // e o terminal já mostrava a próxima senha com o ambiente ainda aberto).
                            for(var a = 0; a < 10; a++) {
                                if(this.lightsOutState[a]) {
                                    this.lightsOutState[a] = false;
                                    this.aplicarEstadoVisual(a, false);
                                }
                            }
                            this.atualizarPulsos();
                        }
                    } else {
                        this.inputAtual = "";
                        this.textoDisplay.setAttribute('troika-text', 'value: ERRO!; color: #ff2d55; align: center; fontSize: 0.06');
                        this.textoDisplay.setAttribute('position', '0 0 0.01');
                        var self = this;
                        setTimeout(function(){ self.atualizarDisplay(); }, 1000);
                        return;
                    }
                } else {
                    if(this.inputAtual.length < 5) this.inputAtual += tecla;
                }
                this.atualizarDisplay();
            },

            ativarAcessoDireto: function() {
                if (this.terminalStep >= 4) return;
                this.terminalStep = 4;
                this.inputAtual = "";
                for (var r = 0; r < this.aneisCupula.length; r++) {
                    this.aneisCupula[r].setAttribute('material', 'color', this.corCoroa);
                }
                this.textoDisplay.setAttribute('troika-text', 'value: ACESSO TOTAL!\nSISTEMA ONLINE\n[ C ] P/ REINICIAR; color: #39ff14; align: center; fontSize: 0.045');
                this.textoDisplay.setAttribute('position', '0 0 0.01');
                this.atualizarJumbotron();
                for (var a = 0; a < 10; a++) {
                    this.lightsOutState[a] = true;
                    this.aplicarEstadoVisual(a, true);
                }
                this.atualizarPulsos();
            },

            ativarModoDev: function() {
                var rig = document.querySelector('#rig');
                if (rig && rig.components['vertical-movement']) {
                    rig.components['vertical-movement'].active = true;
                }
                this.inputAtual = "";
                this.textoDisplay.setAttribute('troika-text', 'value: DEV MODE:\nVOO ATIVADO; color: #d400ff; align: center; fontSize: 0.05');
                this.textoDisplay.setAttribute('position', '0 0 0.01');
                var self = this;
                setTimeout(function(){ 
                    if(self.terminalStep === 4) {
                        self.textoDisplay.setAttribute('troika-text', 'value: ACESSO TOTAL!\nSISTEMA ONLINE\n[ C ] P/ REINICIAR; color: #39ff14; align: center; fontSize: 0.045');
                    } else {
                        self.atualizarDisplay(); 
                    }
                }, 2000);
            },

            // Jumbotron ligado às SENHAS (terminalStep): mostra a pergunta da etapa atual numa face
            // (mapaEnigmas) e o conteúdo padrão nas demais; com acesso total, tudo volta ao padrão.
            atualizarJumbotron: function() {
                var self = this;
                var acessoTotal = this.terminalStep >= 4;
                var mapaEnigmas = [2, 1, 3, 0];
                var faces = document.querySelectorAll('.jumbotron-face');
                faces.forEach(function(faceEl, i) {
                    var logo = faceEl.querySelector('.jumbotron-logo');
                    var texto = faceEl.querySelector('.jumbotron-texto');
                    var txtPadrao = faceEl.getAttribute('data-default');
                    var linhas = faceEl.querySelectorAll('.jumbotron-linha');
                    if (!logo || !texto) return;
                    if (!acessoTotal && i === mapaEnigmas[self.terminalStep]) {
                        logo.setAttribute('visible', 'false');
                        texto.setAttribute('position', '0 0 0.02');
                        texto.setAttribute('troika-text', 'value', self.enigmas[self.terminalStep]);
                        texto.setAttribute('troika-text', 'color', '#000000');
                        texto.setAttribute('troika-text', 'fontSize', '0.34');
                        texto.setAttribute('troika-text', 'maxWidth', '5.4');
                        texto.setAttribute('troika-text', 'lineHeight', '1.15');
                        if (linhas) linhas.forEach(function(l) { l.setAttribute('color', '#ff2d55'); });
                    } else {
                        logo.setAttribute('visible', 'true');
                        texto.setAttribute('position', '0 -1.4 0.02');
                        texto.setAttribute('troika-text', 'value', txtPadrao);
                        texto.setAttribute('troika-text', 'color', '#05010f');
                        texto.setAttribute('troika-text', 'fontSize', '0.18');
                        texto.setAttribute('troika-text', 'maxWidth', '5');
                        texto.setAttribute('troika-text', 'lineHeight', '1.2');
                        if (linhas) linhas.forEach(function(l) { l.setAttribute('color', '#ffee00'); });
                    }
                });
            },

            atualizarDisplay: function() {
                if(this.terminalStep < 4) {
                    var displayVis = this.inputAtual.length > 0 ? this.inputAtual : '_ _ _';
                    this.textoDisplay.setAttribute('troika-text', 'value: SENHA ' + (this.terminalStep + 1) + ':\n' + displayVis + '; color: #00fff2; align: center; fontSize: 0.055');
                    this.textoDisplay.setAttribute('position', '0 0 0.01');
                }
            },

            resetJogo: function() {
                this.terminalStep = 0;
                this.inputAtual = "";
                this.atualizarDisplay();
                
                for(var r = 0; r < 4; r++) {
                    this.aneisCupula[r].setAttribute('material', 'color', this.corApagada);
                }

                for(var a = 0; a < 10; a++) {
                    this.lightsOutState[a] = false;
                    this.aplicarEstadoVisual(a, false);
                }

                this.atualizarJumbotron(); // volta à pergunta 1 (terminalStep = 0)

                teleportarComBlink(0, 0, 8 * window.ESCALA_MUNDO, 0, function() {
                    esconderSalas();
                    abrirMenuInicial();
                }, true); // true: volta olhando de frente para o menu (também no óculos)

                this.atualizarPulsos();
            }
        });
    </script>
</head>
<body>
    <div id="coord-display" style="position:fixed; top:15px; left:15px; z-index:9999; background:rgba(0,0,0,0.8); color:#00fff2; padding:10px 15px; border:1px solid #00fff2; border-radius:6px; font-family:monospace; font-size:14px; pointer-events:none; text-shadow: 0 0 5px #00fff2;">
        X: 0.000 | Y: 0.000 | Z: 0.000
    </div>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .interactable" renderer="antialias: true; colorManagement: true" background="color: #05010f" webxr="referenceSpaceType: local-floor">

        <a-assets>
            <img id="logo-mgc" src="https://www.museugameciencia.com.br/assets/LogoMuseu-C0J6co-V.png" crossorigin="anonymous">
        </a-assets>

        <a-sky color="#000000"></a-sky>

        <a-entity id="ambiente-museu" scale="0.5 0.5 0.5" visible="false">
            <a-entity gerador-de-salas></a-entity>
            <a-entity salas-geracao></a-entity>

            <a-entity position="0 0 0">
                <a-cylinder position="0 0.25 0" radius="3.2" height="0.5" color="#0c0c18"></a-cylinder>
                <a-torus position="0 0.5 0" rotation="90 0 0" radius="3.2" radius-tubular="0.05" material="shader: flat; color: #00fff2"></a-torus>
                <a-cylinder position="0 1.8 0" radius="0.35" height="2.6" color="#12121f"></a-cylinder>
                <a-entity position="0 3.6 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 14000; easing: linear">
                    <a-box width="0.9" height="0.9" depth="0.9" material="shader: flat; color: #ff00a0"></a-box>
                    <a-torus radius="1.1" radius-tubular="0.04" rotation="70 0 0" material="shader: flat; color: #00fff2"></a-torus>
                </a-entity>
            </a-entity>

            <!-- altura do anel amarelo mais baixo da cúpula principal (alturaAro = 6 + 6,18 + 0,25 ≈ 12,43) -->
            <a-entity position="0 12.43 0">
                <a-box width="5.8" height="4.5" depth="5.8" color="#080810"></a-box>

                <!-- Face 0 -->
                <a-entity class="jumbotron-face" data-default="CONHECIMENTO, APRENDIZADO E DIVERSÃO" position="0 0 3.5" rotation="10 0 0">
                    <a-plane width="6" height="4.5" material="shader: flat; color: #ffffff">
                        <a-plane position="0 0 -0.01" width="6.2" height="4.7" material="shader: flat; color: #ffee00"></a-plane>
                        <a-image class="jumbotron-logo" src="#logo-mgc" position="0 0.4 0.02" width="4.5" height="2.25" transparent="true"></a-image>
                        <a-entity class="jumbotron-texto" troika-text="value: CONHECIMENTO, APRENDIZADO E DIVERSÃO; color: #05010f; align: center; fontSize: 0.18; maxWidth: 5" position="0 -1.4 0.02"></a-entity>
                        <a-plane class="jumbotron-linha" position="0 1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                        <a-plane class="jumbotron-linha" position="0 -1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                    </a-plane>
                </a-entity>

                <!-- Face 1 -->
                <a-entity class="jumbotron-face" data-default="CONHECIMENTO, APRENDIZADO E DIVERSÃO" position="0 0 -3.5" rotation="10 180 0">
                    <a-plane width="6" height="4.5" material="shader: flat; color: #ffffff">
                        <a-plane position="0 0 -0.01" width="6.2" height="4.7" material="shader: flat; color: #ffee00"></a-plane>
                        <a-image class="jumbotron-logo" src="#logo-mgc" position="0 0.4 0.02" width="4.5" height="2.25" transparent="true"></a-image>
                        <a-entity class="jumbotron-texto" troika-text="value: CONHECIMENTO, APRENDIZADO E DIVERSÃO; color: #05010f; align: center; fontSize: 0.18; maxWidth: 5" position="0 -1.4 0.02"></a-entity>
                        <a-plane class="jumbotron-linha" position="0 1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                        <a-plane class="jumbotron-linha" position="0 -1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                    </a-plane>
                </a-entity>

                <!-- Face 2 -->
                <a-entity class="jumbotron-face" data-default="DIVULGANDO A CIÊNCIA POR MEIO DOS JOGOS" position="3.5 0 0" rotation="10 90 0">
                    <a-plane width="6" height="4.5" material="shader: flat; color: #ffffff">
                        <a-plane position="0 0 -0.01" width="6.2" height="4.7" material="shader: flat; color: #ffee00"></a-plane>
                        <a-image class="jumbotron-logo" src="#logo-mgc" position="0 0.4 0.02" width="4.5" height="2.25" transparent="true"></a-image>
                        <a-entity class="jumbotron-texto" troika-text="value: DIVULGANDO A CIÊNCIA POR MEIO DOS JOGOS; color: #05010f; align: center; fontSize: 0.18; maxWidth: 5" position="0 -1.4 0.02"></a-entity>
                        <a-plane class="jumbotron-linha" position="0 1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                        <a-plane class="jumbotron-linha" position="0 -1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                    </a-plane>
                </a-entity>

                <!-- Face 3 -->
                <a-entity class="jumbotron-face" data-default="DIVULGANDO A CIÊNCIA POR MEIO DOS JOGOS" position="-3.5 0 0" rotation="10 -90 0">
                    <a-plane width="6" height="4.5" material="shader: flat; color: #ffffff">
                        <a-plane position="0 0 -0.01" width="6.2" height="4.7" material="shader: flat; color: #ffee00"></a-plane>
                        <a-image class="jumbotron-logo" src="#logo-mgc" position="0 0.4 0.02" width="4.5" height="2.25" transparent="true"></a-image>
                        <a-entity class="jumbotron-texto" troika-text="value: DIVULGANDO A CIÊNCIA POR MEIO DOS JOGOS; color: #05010f; align: center; fontSize: 0.18; maxWidth: 5" position="0 -1.4 0.02"></a-entity>
                        <a-plane class="jumbotron-linha" position="0 1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                        <a-plane class="jumbotron-linha" position="0 -1.8 0.02" width="5.4" height="0.08" color="#ffee00"></a-plane>
                    </a-plane>
                </a-entity>
            </a-entity>
        </a-entity>

        <a-light type="ambient" color="#3a3550" intensity="0.7"></a-light>
        <a-light type="point" intensity="0.9" position="0 8 0" color="#ffffff" distance="60"></a-light>

        <!-- ==========================================
             MENU INICIAL EM VR (mouse no desktop, laser no óculos)
             Fica no espaço do mundo (fora de #ambiente-museu, que tem escala 0.5),
             diante do ponto de partida do jogador (rig em 0 0 4, olhando para -z).
             ========================================== -->
        <a-entity id="menu-inicial-vr">
            <a-circle radius="2.4" rotation="-90 0 0" position="0 0.01 3.2" material="shader: flat; color: #0a0a14"></a-circle>
            <a-torus radius="2.4" radius-tubular="0.012" rotation="90 0 0" position="0 0.02 3.2" segments-tubular="48" material="shader: flat; color: #00fff2"></a-torus>

            <a-entity position="0 1.7 1.6">
                <a-plane width="3.06" height="2.16" position="0 0 -0.01" material="shader: flat; color: #00fff2"></a-plane>
                <a-plane width="3.0" height="2.1" material="shader: flat; color: #06060f"></a-plane>

                <a-entity logo-proporcional position="0 0.45 0.01">
                    <a-plane class="logo-fundo" width="1.76" height="0.96" position="0 0 0" material="shader: flat; color: #ffffff"></a-plane>
                    <a-image class="logo-imagem" src="#logo-mgc" width="1.6" height="0.8" position="0 0 0.01" transparent="true"></a-image>
                </a-entity>

                <a-entity position="-0.72 -0.42 0.02">
                    <a-plane width="1.36" height="0.42" position="0 0 -0.006" material="shader: flat; color: #00fff2"></a-plane>
                    <a-plane class="interactable" botao-modo="modo: visitar; cor: #00fff2" width="1.3" height="0.36" material="shader: flat; color: #0c0c18">
                        <a-entity troika-text="value: VISITAR EXPOSIÇÃO; color: #00fff2; align: center; fontSize: 0.085; letterSpacing: 0.05; maxWidth: 1.25" position="0 0 0.01"></a-entity>
                    </a-plane>
                </a-entity>
                <a-entity position="0.72 -0.42 0.02">
                    <a-plane width="1.36" height="0.42" position="0 0 -0.006" material="shader: flat; color: #ff2d55"></a-plane>
                    <a-plane class="interactable" botao-modo="modo: escape; cor: #ff2d55" width="1.3" height="0.36" material="shader: flat; color: #0c0c18">
                        <a-entity troika-text="value: INICIAR ESCAPE ROOM; color: #ff2d55; align: center; fontSize: 0.085; letterSpacing: 0.05; maxWidth: 1.25" position="0 0 0.01"></a-entity>
                    </a-plane>
                </a-entity>

                <!-- Espaço reservado para os agradecimentos (a definir): adicione aqui um
                     <a-entity troika-text="value: ...; fontSize: 0.07; align: center; maxWidth: 2.7" position="0 -0.82 0.02"> -->
                <a-entity id="menu-rodape" position="0 -0.82 0.02"></a-entity>
            </a-entity>
        </a-entity>

        <a-entity id="rig" position="0 0 4" movement-controls="speed: 0.2; enabled: false" vertical-movement rastreador-coords>
            <a-camera id="camera-jogador" position="0 1.6 0" look-controls="enabled: false" wasd-controls="enabled: false">
                <a-sphere id="blink" blink-fade radius="0.4" segments-width="12" segments-height="8" material="shader: flat; color: #000000; side: back; transparent: true; opacity: 0; depthTest: false; depthWrite: false"></a-sphere>
                <a-ring id="mouse-cursor" mouse-cursor-tracker radius-inner="0.015" radius-outer="0.025" color="#00fff2" material="shader: flat; opacity: 0.8"></a-ring>
            </a-camera>
            <a-entity laser-controls="hand: left" raycaster="far: 10; objects: .interactable" line="color: #00fff2; opacity: 0.6"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="far: 10; objects: .interactable" line="color: #ff00a0; opacity: 0.6"></a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
